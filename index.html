  .bg-overlay{
    position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(180deg, rgba(6,4,8,0.30) 0%, rgba(6,4,8,0.15) 35%, rgba(6,4,8,0.55) 75%, rgba(6,4,8,0.85) 100%);
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 6vw;
  }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
  }
  .icon-btn svg{ width:15px; height:15px; fill:var(--ink); }
  .icon-row{ display:flex; gap:10px; }

  .hero{
    text-align:center; padding: 6vh 6vw 2vh;
  }
  .wordmark{
    font-weight:900;
    font-size:clamp(46px, 13vw, 100px);
    line-height:0.95;
    margin:0;
    text-shadow:0 8px 50px rgba(0,0,0,0.7);
  }
  .wordmark span{ color:var(--gold); }
  .tagline{
    color:var(--ink-dim);
    font-size:14.5px;
    margin-top:16px;
    max-width:380px;
    margin-inline:auto;
    text-shadow:0 2px 14px rgba(0,0,0,0.65);
  }

  /* ---------- floating pill player ---------- */
  .player-dock{
    position:fixed; left:4vw; right:4vw; bottom:22px; z-index:20;
  }
  .pill{
    background:linear-gradient(160deg, rgba(60,30,20,0.55), rgba(20,14,18,0.75));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:32px;
    padding:12px 16px 14px;
    box-shadow:0 20px 50px -18px rgba(0,0,0,0.6);
  }
  .pill-top{ display:flex; align-items:center; gap:12px; }
  .art{
    flex:none; width:52px; height:52px; border-radius:50%; overflow:hidden;
    border:2px solid rgba(255,255,255,0.5); background:#222;
  }
  .art img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pill-info{ flex:1; min-width:0; }
  .pill-title{ font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill-meta{ font-size:12px; color:var(--ink-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .pill-controls{ flex:none; display:flex; align-items:center; gap:10px; }
  .ctrl-btn{
    background:none; border:none; cursor:pointer;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  }
  .ctrl-btn svg{ width:16px; height:16px; fill:var(--ink); }
  .play-btn{
    flex:none; width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px -6px rgba(0,0,0,0.5);
  }
  .play-btn svg{ width:17px; height:17px; fill:#151315; margin-left:2px; }
  .play-btn.playing svg{ margin-left:0; }

  .pill-progress{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .p-time{ font-size:10.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; width:30px; flex:none; }
  .p-time.end{ text-align:right; }
  .p-bar{
    flex:1; height:4px; background:rgba(255,255,255,0.25); border-radius:100px; position:relative; cursor:pointer;
  }
  .p-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:#fff; border-radius:100px; }
  .p-dot{
    position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:#fff;
    transform:translate(-50%,-50%); left:0%; box-shadow:0 1px 4px rgba(0,0,0,0.4);
  }

  .follow{
    text-align:center; margin-top:10px; font-size:12px; color:var(--ink-dim);
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<div class="bg-photo"></div>
<div class="bg-overlay"></div>

<header>
  <div class="icon-row">
    <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" stroke="currentColor" fill="none"/></svg></div>
  </div>
  <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
</header>

<section class="hero">
  <h1 class="wordmark">CHEEMA <span>Y</span></h1>
  <p class="tagline">Official music player — Bermuda Triangle, The Simpsons, Anyway & more.</p>
</section>

<div class="player-dock">
  <div class="pill">
    <div class="pill-top">
      <div class="art"><img id="artImg" src="" alt=""></div>
      <div class="pill-info">
        <div class="pill-title" id="npTitle">Tap play to start</div>
        <div class="pill-meta" id="npMeta">Cheema Y</div>
      </div>
      <div class="pill-controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="play-btn" id="playBtn" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
        </button>
      </div>
    </div>
    <div class="pill-progress">
      <span class="p-time" id="curTime">0:00</span>
      <div class="p-bar" id="pBar">
        <div class="p-fill" id="pFill"></div>
        <div class="p-dot" id="pDot"></div>
      </div>
      <span class="p-time end" id="durTime">0:00</span>
    </div>
  </div>
  <div class="follow">Fan-made Cheema Y music player</div>
</div>

<div id="ytplayer" style="position:absolute; width:0; height:0; overflow:hidden;"></div>

<script>
  const PLAYLIST = [
    { id:"MUIEmo9VQ4I", title:"Jackpot", meta:"Cheema Y ft. Gur Sidhu" },
    { id:"Ig_z2LzYsa8", title:"CEO", meta:"Cheema Y ft. Gur Sidhu" },
    { id:"i0RJTOFwcgk", title:"Cartel", meta:"Cheema Y ft. Gur Sidhu" },
    { id:"Bi9O_pEUENQ", title:"Komagata Maru", meta:"Cheema Y ft. Gur Sidhu" },
    { id:"wnY1zIpiTJo", title:"Tutor", meta:"Cheema Y ft. Gur Sidhu" },
    { id:"_PaMNT02RXU", title:"California Love", meta:"Cheema Y ft. Gur Sidhu" },
    { id:"_ZDy9zyFT7c", title:"Snake", meta:"Cheema Y ft. Gur Sidhu" },
  ];

  function thumbUrl(id){ return `https://img.youtube.com/vi/${id}/hqdefault.jpg`; }
  function fmtTime(s){
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ':' + String(sec).padStart(2,'0');
  }

  let currentIndex = 0;
  let ytPlayer = null, ytReady = false, wantsPlayOnReady = false;
  let progressInterval = null;

  function updateNowPlaying(){
    const t = PLAYLIST[currentIndex];
    document.getElementById('npTitle').textContent = t.title;
    document.getElementById('npMeta').textContent = t.meta;
    document.getElementById('artImg').src = thumbUrl(t.id);
    document.getElementById('curTime').textContent = '0:00';
    document.getElementById('durTime').textContent = '0:00';
    document.getElementById('pFill').style.width = '0%';
    document.getElementById('pDot').style.left = '0%';
  }
  updateNowPlaying();

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  function onYouTubeIframeAPIReady(){
    ytPlayer = new YT.Player('ytplayer', {
      height:'0', width:'0',
      playerVars: { autoplay:0, controls:0 },
      events: {
        onReady: () => {
          ytReady = true;
          ytPlayer.cueVideoById(PLAYLIST[currentIndex].id);
          if (wantsPlayOnReady) ytPlayer.playVideo();
        },
        onStateChange: onPlayerStateChange
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function onPlayerStateChange(e){
    const playing = e.data === YT.PlayerState.PLAYING;
    setPlayingUI(playing);
    if (playing) startProgressLoop(); else stopProgressLoop();
    if (e.data === YT.PlayerState.ENDED) goTo(currentIndex + 1, true);
  }

  function startProgressLoop(){
    stopProgressLoop();
    progressInterval = setInterval(() => {
      if (!ytPlayer || !ytPlayer.getCurrentTime) return;
      const cur = ytPlayer.getCurrentTime();
      const dur = ytPlayer.getDuration();
      document.getElementById('curTime').textContent = fmtTime(cur);
      document.getElementById('durTime').textContent = fmtTime(dur);
      const pct = dur > 0 ? (cur/dur*100) : 0;
      document.getElementById('pFill').style.width = pct + '%';
      document.getElementById('pDot').style.left = pct + '%';
    }, 500);
  }
  function stopProgressLoop(){ if (progressInterval) clearInterval(progressInterval); }

  function setPlayingUI(playing){
    document.getElementById('playIcon').innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    document.getElementById('playBtn').classList.toggle('playing', playing);
  }

  function goTo(index, autoplay){
    currentIndex = (index + PLAYLIST.length) % PLAYLIST.length;
    updateNowPlaying();
    if (!ytReady){ wantsPlayOnReady = autoplay; return; }
    if (autoplay) ytPlayer.loadVideoById(PLAYLIST[currentIndex].id);
    else ytPlayer.cueVideoById(PLAYLIST[currentIndex].id);
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    if (!ytReady){ wantsPlayOnReady = true; return; }
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
  });
  document.getElementById('nextBtn').addEventListener('click', () => goTo(currentIndex + 1, true));
  document.getElementById('prevBtn').addEventListener('click', () => goTo(currentIndex - 1, true));

  document.getElementById('pBar').addEventListener('click', (e) => {
    if (!ytPlayer || !ytReady) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const dur = ytPlayer.getDuration();
    if (dur > 0) ytPlayer.seekTo(dur * pct, true);
  });
</script>

</body>
</html>
